# Machine-readable licensing manifest, in the REUSE specification's REUSE.toml
# form (version 3.3 of the specification).  It says, for the paths below, what
# the root NOTICE and LICENSES/README.md already say, and nothing more.
#
# WHAT IT COVERS: (1) the guides' sources and PDFs under docs/ (a separate work
