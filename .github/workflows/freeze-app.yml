#  FREEZE THE APP OF A RELEASE at /vYYMM/app/ — built FROM THE TAG.
#
#  WHY.  /releases/ promises "a frozen, never-touched copy of the app: the URL
#  you cite, teach from, and archive", and nothing in this repository produced
#  one.  /v2607/app/ exists because somebody built and uploaded it by hand;
#  when v2608 was cut, the homepage button was renamed to a copy that had never
#  been made and served a 404 to every visitor (2026-09-02).
#
#  THE ONE THING THAT MAKES IT "FROZEN" is that it is built from the TAG, in a
#  clean checkout, with `--base=/vYYMM/app/` so every asset it fetches is its
#  own.  A copy built from the default branch and parked under a version URL is
#  the failure this exists to prevent: the visitor believes they are on the
#  release and they are running Choupo-dev.  Four checks below assert it, and
#  the sharpest is the THIRD -- the engine's own version string is compiled
#  into the WASM, so grepping the binary for it proves the release engine is
#  what ships, rather than the label on the directory.
#
#  IT PUBLISHES ONLY ITS OWN SUBTREE.  No --delete anywhere near the site root,
#  CNAME untouched, other releases untouched.  And it REFUSES to overwrite a
#  frozen copy that already exists: never-touched is the whole claim.
name: freeze-app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose app to freeze — vYYMM'
        required: true

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          #  vYYMM, or vYYMM.N for a patch cut from a release-YYMM branch.
          #  RELEASING.md line 51 always said "a patch gets its own tag" and
          #  never said what it looks like; v2608.1 is that form, settled
          #  2026-09-02 when the first patch actually shipped.
          case "$TAG" in
            v[0-9][0-9][0-9][0-9]) ;;
            v[0-9][0-9][0-9][0-9].[0-9]) ;;
            *) echo "REFUSED: '$TAG' is neither vYYMM nor vYYMM.N."; exit 1 ;;
          esac
          #  A PATCH DOES NOT GET ITS OWN URL.  v2608.1 is a packaging fix to
          #  Choupo-2608: the engine is the same engine, the citation is the
          #  same citation, and the copy is published at /v2608/app/ -- the
          #  address /releases/ tells a student to cite.  A patch that moved
          #  the URL would be a release under another name.
          echo "REL=${TAG%%.*}" >> "$GITHUB_ENV"
          echo "app URL prefix: /${TAG%%.*}/app/"

      #  THE TAG, not the branch.  fetch-depth 0 so the checkout carries the
      #  history the build's own freshness checks read.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: LaTeX (the guides this release's Help serves)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended lmodern

      - name: Build the WASM of this release
        run: make wasm-gui

      - name: Build this release's guides
        run: make -C docs all

      - name: Install the app's dependencies
        run: npm ci --no-audit --no-fund
        working-directory: gui

      #  `npm run build` hardcodes no base, so the app at /app/ resolves from
      #  the root.  A frozen copy must resolve from ITS OWN prefix or it will
      #  quietly load the development bundle's assets.
      - name: Build the app rooted at its own URL
        working-directory: gui
        run: |
          set -euo pipefail
          npm run prebuild
          npx tsc -p tsconfig.json --noEmit
          node --max-old-space-size=4096 ./node_modules/vite/bin/vite.js build \
               --base="/$REL/app/"

      - name: Prove it is the release, and self-contained
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          d=gui/dist
          [ -s "$d/index.html" ] || { echo "no app was built"; exit 1; }

          #  (1) every asset it asks for is under its own prefix
          if grep -qE '(src|href)="/(assets|wasm|logo)' "$d/index.html"; then
            echo "REFUSED: the built index.html references ROOT paths --"
            echo "the --base did not take, and this copy would load the"
            echo "development bundle's assets while claiming to be $TAG."
            grep -oE '(src|href)="[^"]*"' "$d/index.html" | sort -u
            exit 1
          fi
          grep -q "/$REL/app/assets/" "$d/index.html" \
            || { echo "REFUSED: index.html does not reference /$REL/app/assets/"; exit 1; }

          #  (2) it carries its own engine, and a real one
          sz=$(stat -c%s "$d/wasm/choupoSolve.wasm")
          [ "$sz" -gt 1000000 ] || { echo "choupoSolve.wasm is $sz B -- not a build"; exit 1; }

          #  (3) THE SHARPEST CHECK.  CHOUPO_VERSION is compiled into the
          #  binary, so the engine states its own identity independently of
          #  the directory it was filed under.  A dev build parked at a
          #  version URL fails here and passes everything else.
          #  The engine's identity is the RELEASE's.  A patch tag does not
          #  restamp CHOUPO_VERSION -- if it did, the frozen app would announce
          #  a version no citation names, which is the same lie in the other
          #  direction.
          #
          #  THIS ARM USED TO OVERCLAIM, and measuring the published copy is
          #  what showed it.  make/wasm.mk embeds data/standards into the
          #  binary, and data/standards/CATALOGUE.dat declares the CATALOGUE's
          #  own release -- a different thing from the engine's version, and
          #  today a different value (the corpus is still sealed against
          #  Choupo-2607; renaming it is a reseal, reserved for Vitor).  So a
          #  bare `grep "Choupo-YYMM"` can be satisfied by the catalogue
          #  rather than by the banner, and the comment saying "the engine
          #  states its own identity" was describing more than the grep did.
          #
          #  So the arm is a SET, not a presence: every Choupo-* string in the
          #  binary must be either the release's own version or the catalogue
          #  identity declared in this same checkout.  A development build
          #  carries Choupo-dev and fails; a stale or mixed build carries a
          #  third name and fails; and the catalogue's name is accounted for
          #  BY NAME rather than quietly satisfying the check.
          want="Choupo-${REL#v}"
          cat_rel=$(sed -n 's/.*release[[:space:]]\+\(Choupo-[0-9A-Za-z.-]*\);.*/\1/p' \
                    data/standards/CATALOGUE.dat | head -1)
          echo "engine must state: $want; catalogue declares: ${cat_rel:-<none>}"
          found=$(grep -oaE 'Choupo-[0-9A-Za-z.]+' "$d/wasm/choupoSolve.wasm" | sort -u)
          if ! printf '%s\n' "$found" | grep -qx "$want"; then
            echo "REFUSED: the WASM does not carry '$want' -- this is not the"
            echo "engine of $TAG.  It carries:"; printf '  %s\n' $found
            exit 1
          fi
          for v in $found; do
            if [ "$v" != "$want" ] && [ "$v" != "$cat_rel" ]; then
              echo "REFUSED: the WASM carries '$v', which is neither this"
              echo "release's engine version ($want) nor the catalogue"
              echo "identity this checkout declares (${cat_rel:-<none>})."
              echo "A frozen app running a different engine than its label is"
              echo "the defect this check exists for."
              exit 1
            fi
          done

          #  (4) Help must open something.  CORRECTION, 2026-09-02: this
          #  comment used to say "/v2607/app/docs/guides.json is a 404, so the
          #  frozen 2607 Help opens nothing".  The 404 is real; the causal
          #  claim was not, and an audit caught it.  2607 has no guide.html at
          #  all -- the viewer postdates it -- so its Help lists four guides
          #  and hands each to the browser's own PDF handler, which is the
          #  behaviour that made this project write a viewer.  A true
          #  observation with an invented cause is the failure mode this repo
          #  hunts, and it got in here.  What the check asserts is unchanged:
          #  a release whose Help page cannot find its manifest opens nothing.
          [ -s "$d/docs/guides.json" ] \
            || { echo "REFUSED: no guides.json -- Help would open nothing"; exit 1; }
          for g in $(python3 -c "import json;print(' '.join(json.load(open('$d/docs/guides.json'))))"); do
            [ -s "$d/docs/$g.pdf" ] || { echo "REFUSED: docs/$g.pdf missing"; exit 1; }
          done
          #  (5) WHAT IT FETCHES WHEN IT RUNS.  Checks (1)-(4) read the entry
          #  point, the binary and the manifest -- everything the app IS at
          #  rest -- and every one of them passed on the bundle published at
          #  /v2608/app/ on 2026-09-02, which loaded correctly and then, on
          #  running a case, fetched the engine from the SITE ROOT: a frozen
          #  shell around the development solver, and true of /v2607/app/ too.
          #  A check that reads only the resting state cannot see it.  The
          #  worker is plain JavaScript in public/, so vite never rewrites its
          #  paths and `import.meta.env.BASE_URL` is not available to it; the
          #  engine URL must therefore be relative to the worker's own
          #  location, and a root-absolute one here is the defect itself.
          #
          #  The worker's own header EXPLAINS the defect and quotes the
          #  literal, so a plain text search fires on the record of the bug as
          #  readily as on the bug -- a search cannot tell a live claim from a
          #  recorded one.  Comment-only lines are therefore dropped first: a
          #  fetch is code, and live code that resolves an engine URL is never
          #  on a line that begins with a comment marker.  Nothing else is
          #  stripped, so an inline comment cannot hide a live literal either.
          w="$d/workers/solverWorker.js"
          [ -s "$w" ] || { echo "REFUSED: no solverWorker.js -- nothing would run"; exit 1; }
          if grep -vE '^[[:space:]]*(//|/\*|\*)' "$w" | grep -qE '["`]/wasm/'; then
            echo "REFUSED: solverWorker.js fetches the engine from a ROOT path."
            echo "This copy would load the DEVELOPMENT solver while claiming"
            echo "to be $TAG.  The engine URL must resolve from the worker's"
            echo "own location (new URL('../wasm/…', self.location.href))."
            grep -nE '["`]/wasm/' "$w" | grep -vE ':[[:space:]]*(//|/\*|\*)'
            exit 1
          fi
          if grep -rqE '["`]/(wasm|workers)/' "$d/assets/" 2>/dev/null; then
            echo "REFUSED: a bundled asset names a ROOT /wasm/ or /workers/ path."
            grep -rnoE '["`]/(wasm|workers)/[a-zA-Z.]*' "$d/assets/" | head
            exit 1
          fi
          echo "frozen app OK: $(du -sh $d | cut -f1), engine states $want,"
          echo "  and resolves it from /$REL/app/ when it runs"

      - name: Publish it beside the other releases
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SITE_REPO: git@github.com:choupo-admin/choupo-admin.github.io.git
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::SITE_DEPLOY_KEY not configured -- built and verified, NOT published."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 "$SITE_REPO" /tmp/site

          #  NEVER-TOUCHED IS THE CLAIM, and it stands.  A frozen copy that
          #  can be rebuilt over is not frozen, it is merely old.
          #
          #  ONE EXCEPTION, and it is SELF-LIMITING in the shape of
          #  withdraw-release.yml: a bundle whose worker fetches the engine
          #  from a ROOT path is not a frozen copy of anything -- it is a
          #  shell that runs whatever solver happens to sit at the site root
          #  today, which on 2026-09-02 was Choupo-dev.  Such a copy never was
          #  the release's app, so replacing it does not overwrite a frozen
          #  app; it makes one exist for the first time.  The guard PROVES the
          #  defect from the published bytes before it will act, so once a
          #  correct copy is in place this branch can never fire on it again,
          #  and it can never fire on an honest frozen app at all.
          #
          #  THE SECOND EXCEPTION IS A LATER PATCH OF THE SAME LINE (rule
          #  written 2026-09-03; no second patch has shipped, and whether one
          #  ever does is Vitor's call -- a release is frozen, and the
          #  development line is where the work goes).  A patch tag vYYMM.N is
          #  published at the SAME address as the release (RELEASING.md: a
          #  patch does not get its own URL), so the second patch of a line
          #  necessarily replaces the copy the first one built.  That is not
          #  a frozen copy being rebuilt over: the copy RECORDS the commit it
          #  was built from (wasm/version.json), the new tag DESCENDS from
          #  that commit on the release branch, and the record of which bytes
          #  were served when is the tag list, which is immutable.  The guard
          #  PROVES the descent from the published bytes and the checked-out
          #  history before it acts: a copy whose commit is unknown, not an
          #  ancestor of this tag, or already this tag's own, is refused.
          #  "Never touched" therefore means: never replaced by anything the
          #  release line did not itself produce later.
          replacing=""
          if [ -e "/tmp/site/$REL/app" ]; then
            pub="/tmp/site/$REL/app/workers/solverWorker.js"
            #  The SAME comment-aware rule as check (5), and for a sharper
            #  reason: here a match AUTHORISES DESTRUCTION.  A frozen app whose
            #  worker merely mentions the defect in a comment is an honest one,
            #  and firing on that would delete exactly what this guard exists
            #  to protect.
            if [ -s "$pub" ] \
               && grep -vE '^[[:space:]]*(//|/\*|\*)' "$pub" | grep -qE '["`]/wasm/'; then
              echo "::warning::/$REL/app/ exists and fetches its engine from the"
              echo "site ROOT -- it is a shell around the live solver, not a"
              echo "frozen copy of Choupo-${REL#v}.  Replacing it."
              grep -nE '["`]/wasm/' "$pub" | grep -vE ':[[:space:]]*(//|/\*|\*)'
              replacing="yes"
            else
              vj="/tmp/site/$REL/app/wasm/version.json"
              was=$(grep -oE '"commit"[[:space:]]*:[[:space:]]*"[0-9a-f]+"' "$vj" 2>/dev/null \
                    | grep -oE '[0-9a-f]+"$' | tr -d '"' || true)
              here=$(git rev-parse "$TAG^{commit}")
              if [ "$TAG" = "$REL" ]; then
                echo "REFUSED: /$REL/app/ already exists and resolves its own"
                echo "engine; '$TAG' is the release tag itself, not a patch of it."
                exit 1
              elif [ -z "$was" ]; then
                echo "REFUSED: /$REL/app/ exists but its wasm/version.json records"
                echo "no build commit, so its descent cannot be proved."
                exit 1
              elif ! git cat-file -e "$was^{commit}" 2>/dev/null; then
                echo "REFUSED: /$REL/app/ records build commit $was, which this"
                echo "checkout does not contain -- not a copy this line produced."
                exit 1
              elif [ "$(git rev-parse "$was^{commit}")" = "$here" ]; then
                echo "REFUSED: /$REL/app/ is already built from $TAG's own commit."
                exit 1
              elif ! git merge-base --is-ancestor "$was" "$here"; then
                echo "REFUSED: /$REL/app/ was built from $was, and '$TAG' does not"
                echo "descend from it -- a patch must continue the published line."
                exit 1
              else
                echo "::warning::/$REL/app/ was built from $was; '$TAG' descends"
                echo "from it on the same release line.  Superseding the copy --"
                echo "the tag list records which bytes were served when."
                git log --oneline "$was..$here" | sed 's/^/    /'
                replacing="yes"
              fi
            fi
          fi

          #  Only its own subtree.  No --delete, nothing near the site root.
          if [ -n "$replacing" ]; then
            rm -rf "/tmp/site/$REL/app"
          fi
          mkdir -p "/tmp/site/$REL/app"
          rsync -a --exclude='.git' gui/dist/ "/tmp/site/$REL/app/"

          grep -q 'www.choupo.org' /tmp/site/CNAME \
            || { echo "CNAME lost -- refusing to publish"; exit 1; }

          cd /tmp/site
          git config user.name  "Vítor Geraldes"
          git config user.email "talentgroundlda@gmail.com"
          git add "$REL"
          subject="freeze the app of Choupo-${REL#v} at /$REL/app/, built from $TAG"
          if [ -n "$replacing" ]; then
            git commit -m "$subject" -m "The copy previously served here fetched its engine from the site root, so it ran the development solver under a release label.  It was never a frozen copy of this release."
          else
            git commit -m "$subject"
          fi
          git push
          echo "published /$REL/app/"
