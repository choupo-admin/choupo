# =============================================================================
#  publish-site  --  build Choupo-dev, verify it, and push it to the site.
#
#  THE SITE IS ANOTHER REPOSITORY.  www.choupo.org is served by
#  `choupo-admin/choupo-admin.github.io` -- the user site, which owns the
#  CNAME and the frozen release copies under /vYYMM/.  THIS repository has
#  no Pages site of its own and must never acquire one: an earlier version
#  of this file ended in actions/deploy-pages and published a SECOND site,
#  at another address, that nobody visits -- uploading a CNAME claiming a
#  domain the user site already owned.  It was green for an afternoon while
#  the live domain served a bundle 55 commits old.  Two repositories
#  claiming one domain is how a live site gets taken away from under
#  itself.  Publishing means pushing INTO the site repository.  Nothing
#  else is publishing.
#
#  THE KEY.  GITHUB_TOKEN cannot write to another repository, so the push
#  uses an SSH DEPLOY KEY: the public half sits on the site repo (Settings
#  -> Deploy keys, "Allow write access" TICKED), the private half here
#  (Settings -> Secrets -> Actions, named SITE_DEPLOY_KEY).  A deploy key
#  is scoped to ONE repository and never expires -- a PAT would carry the
#  whole account and a renewal date.
#
#  WITHOUT THE SECRET this workflow still builds and verifies, and says so
#  in the log.  It does not fail: "no key configured" is a true and
#  harmless state, and a red X would train everyone to ignore the run.  But
#  it never silently claims to have published either.
#
#  ONE ASSEMBLER.  Every step that touches the site calls `bin/buildSite`,
#  the same script `bin/runSite` uses locally and the same one RELEASING.md
#  documents for a hand publish.  A second copy of the assembly here would
#  be a second home for the build recipe, and the day the two disagree is
#  the day "it works locally" stops being evidence about what visitors see.
#
#  WHAT IS PUBLISHED is a STATIC site.  The simulator ships as WebAssembly and
#  runs in the visitor's own browser tab: no server ever solves a flash, there
#  is no per-user state, and a case a visitor opens never leaves their machine.
#  That is why a static host is enough, and it is the property to preserve --
#  the day this needs a backend is the day it needs a different design review.
# =============================================================================
name: publish-site

on:
  push:
    branches: [main]
    #  The DEFAULT branch, which carries Choupo-dev.
    #
    #  Docs-only and test-only changes still rebuild: the landing reads
    #  generated/releaseInventory.json and the app serves docs/*.pdf, so
    #  "nothing visible changed" is not a judgement this file should make.
  workflow_dispatch:

concurrency:
  #  One build at a time, and a newer push wins: an older run's verdict
  #  landing after a newer one is worth spending a cancelled job on.
  group: publish-site
  cancel-in-progress: true

permissions:
  #  Read only, and it stays that way.  The write this workflow performs is
  #  to ANOTHER repository, authorised by the deploy key -- not by
  #  GITHUB_TOKEN.  No `pages:` scope: this repository has no Pages site and
  #  must not acquire one (see the header).
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      #  ---- the toolchain: a C++ compiler for the native binaries the
      #       curation scripts run, Emscripten for the WASM, node for the app,
      #       and LaTeX for the guides the app links to.
      - name: Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.6          # pinned: docs/gui-internals.md documents this
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: LaTeX (the guides the app's Help links serve)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended

      #  ---- the SAME chain proven locally, in the same order ---------------
      - name: Build the WASM the app runs
        run: make wasm-gui

      - name: Install the app's dependencies
        run: npm ci --no-audit --no-fund
        working-directory: gui

      - name: Assemble the site
        run: bin/buildSite

      #  A published site that cannot solve is worse than none: it looks like
      #  the simulator and is not.  Assert the pieces a visitor actually
      #  fetches, by path and by size.  This is the whole point of the run.
      - name: Verify the site is publishable
        run: |
          set -e
          d=site/_dist
          for f in index.html app/index.html models/index.html \
                   wasm/choupoSolve.wasm wasm/choupoProps.wasm CNAME; do
            [ -s "$d/$f" ] || { echo "MISSING or EMPTY: $f"; exit 1; }
          done
          # the solver is megabytes; a stub or a git-lfs pointer is kilobytes
          sz=$(stat -c%s "$d/wasm/choupoSolve.wasm")
          [ "$sz" -gt 1000000 ] || { echo "choupoSolve.wasm is $sz B -- not a build"; exit 1; }
          grep -q "www.choupo.org" "$d/CNAME" || { echo "CNAME does not name the site"; exit 1; }
          #  The site went 55 commits stale once without anyone noticing,
          #  because nothing compared what is BUILT against what is SERVED.
          #  Name a case that exists here and did not exist then: if the
          #  bundle cannot answer for its own corpus, the build is not the
          #  simulator the tutorials describe.
          grep -rqs flash17 "$d/assets/" \
            || { echo "the bundle does not carry the tutorial corpus"; exit 1; }
          echo "site OK: $(du -sh $d | cut -f1)"

      #  ---- publish: push into the SITE repository -------------------------
      #
      #  Skipped, loudly and successfully, when SITE_DEPLOY_KEY is absent.
      #  A missing key is a true state of the world, not a broken build; a
      #  red X here would teach everyone to ignore this workflow, which is
      #  precisely how the site went 55 commits stale unnoticed.
      - name: Publish to www.choupo.org
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SITE_REPO: git@github.com:choupo-admin/choupo-admin.github.io.git
        run: |
          set -e
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::SITE_DEPLOY_KEY not configured -- built and verified, NOT published."
            echo "Add it: site repo -> Settings -> Deploy keys (public half, WRITE access)"
            echo "        this repo -> Settings -> Secrets -> Actions -> SITE_DEPLOY_KEY"
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519   # trailing \n: ssh rejects a key without it
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 "$SITE_REPO" /tmp/site

          #  The two exclusions are LOAD-BEARING, not tidiness:
          #    CNAME  belongs to the site repo -- it is what makes the domain
          #           resolve there, and overwriting it from here is how the
          #           domain gets contested.
          #    v*/    are the FROZEN release apps (/v2607/app/ ...), the
          #           citable URLs.  --delete without this exclusion erases
          #           every past release in one push.
          rsync -a --delete --exclude='.git' --exclude='CNAME' --exclude='v*/' \
                site/_dist/ /tmp/site/

          #  Prove the two survived before committing, not after pushing.
          grep -q 'www.choupo.org' /tmp/site/CNAME \
            || { echo "CNAME lost -- refusing to publish"; exit 1; }
          ls -d /tmp/site/v[0-9]*/app >/dev/null 2>&1 \
            || { echo "frozen release apps lost -- refusing to publish"; exit 1; }

          cd /tmp/site
          git config user.name  "Vítor Geraldes"
          git config user.email "talentgroundlda@gmail.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "::notice::site already matches this build -- nothing to publish."
            exit 0
          fi
          git commit -q -m "site: dev refresh — ${GITHUB_SHA:0:8}" \
                        -m "Built from choupo-admin/choupo@${GITHUB_SHA}."
          git push origin HEAD:main
          echo "::notice::published ${GITHUB_SHA:0:8} -- the top-bar badge must now read it."
