# =============================================================================
#  publish-site  --  BUILD Choupo-dev and prove the site is publishable.
#
#  IT DOES NOT PUBLISH.  Read this before adding a deploy step back.
#
#  www.choupo.org is served by a DIFFERENT repository --
#  `choupo-admin/choupo-admin.github.io`, the user site, which holds the
#  CNAME and the frozen release copy at /v2607/app/.  This workflow once
#  ended in actions/deploy-pages, which published THIS repository's Pages
#  instead: a second site, at another address, that nobody visits -- and
#  worse, it uploaded a CNAME claiming a domain another repository already
#  owns.  Two repositories claiming one domain is how a live site gets
#  taken away from under itself.
#
#  So the deploy job is gone and the build stays.  What survives is worth
#  having on its own: every push proves the WASM links, the app builds, and
#  the pieces a visitor fetches exist at the right paths and the right
#  sizes.  A red build here means "do not publish", which is exactly the
#  question this file can answer without owning the site.
#
#  PUBLISHING is `bin/buildSite` + a push into the site repository (the
#  procedure in RELEASING.md).  Automating that from here needs a deploy
#  key or a PAT in Settings -> Secrets, because GITHUB_TOKEN cannot write
#  to another repository.  That secret does not exist yet; until it does,
#  publishing is a deliberate act, not a side effect of a push.
# =============================================================================
#  build Choupo-dev and verify it is publishable
#
#  WHAT IS PUBLISHED is a STATIC site.  The simulator ships as WebAssembly and
#  runs in the visitor's own browser tab: no server ever solves a flash, there
#  is no per-user state, and a case a visitor opens never leaves their machine.
#  That is why a static host is enough, and it is the property to preserve --
#  the day this needs a backend is the day it needs a different design review.
#
#  ONE ASSEMBLER.  Every step below that touches the site calls
#  `bin/buildSite`, the same script `bin/runSite` uses locally and the same
#  one the publish procedure uses.  A second copy of the assembly here would
#  be a second home for the build recipe, and the day the two disagree is the
#  day "it works locally" stops being evidence about what visitors see.
# =============================================================================
name: publish-site

on:
  push:
    branches: [main]
    #  The DEFAULT branch, which carries Choupo-dev.
    #
    #  Docs-only and test-only changes still rebuild: the landing reads
    #  generated/releaseInventory.json and the app serves docs/*.pdf, so
    #  "nothing visible changed" is not a judgement this file should make.
  workflow_dispatch:

concurrency:
  #  One build at a time, and a newer push wins: an older run's verdict
  #  landing after a newer one is worth spending a cancelled job on.
  group: publish-site
  cancel-in-progress: true

permissions:
  #  Read only.  This workflow builds and checks; it owns no site, so it
  #  needs no `pages: write` and no `id-token: write`.
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      #  ---- the toolchain: a C++ compiler for the native binaries the
      #       curation scripts run, Emscripten for the WASM, node for the app,
      #       and LaTeX for the guides the app links to.
      - name: Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.6          # pinned: docs/gui-internals.md documents this
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: LaTeX (the guides the app's Help links serve)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended

      #  ---- the SAME chain proven locally, in the same order ---------------
      - name: Build the WASM the app runs
        run: make wasm-gui

      - name: Install the app's dependencies
        run: npm ci --no-audit --no-fund
        working-directory: gui

      - name: Assemble the site
        run: bin/buildSite

      #  A published site that cannot solve is worse than none: it looks like
      #  the simulator and is not.  Assert the pieces a visitor actually
      #  fetches, by path and by size.  This is the whole point of the run.
      - name: Verify the site is publishable
        run: |
          set -e
          d=site/_dist
          for f in index.html app/index.html models/index.html \
                   wasm/choupoSolve.wasm wasm/choupoProps.wasm CNAME; do
            [ -s "$d/$f" ] || { echo "MISSING or EMPTY: $f"; exit 1; }
          done
          # the solver is megabytes; a stub or a git-lfs pointer is kilobytes
          sz=$(stat -c%s "$d/wasm/choupoSolve.wasm")
          [ "$sz" -gt 1000000 ] || { echo "choupoSolve.wasm is $sz B -- not a build"; exit 1; }
          grep -q "www.choupo.org" "$d/CNAME" || { echo "CNAME does not name the site"; exit 1; }
          #  The site went 55 commits stale once without anyone noticing,
          #  because nothing compared what is BUILT against what is SERVED.
          #  Name a case that exists here and did not exist then: if the
          #  bundle cannot answer for its own corpus, the build is not the
          #  simulator the tutorials describe.
          grep -rqs flash17 "$d/assets/" \
            || { echo "the bundle does not carry the tutorial corpus"; exit 1; }
          echo "site OK: $(du -sh $d | cut -f1)  --  build only, NOT published"

      #  Deliberately NO deploy.  See the header: the site lives in another
      #  repository, and publishing from here would fight it for the domain.
