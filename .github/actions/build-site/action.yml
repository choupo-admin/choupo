#  build-site  --  the toolchain and the build of the site, in ONE home.
#
#  Two workflows build the site: `publish-site` (main, then pushed to
#  www.choupo.org) and `site-smoke` (any other branch, never published).  The
#  steps lived inside publish-site alone; a second workflow carrying its own
#  copy would be a second home for the build recipe, and the day the two
#  disagreed the smoke would test a site nobody publishes.  The assembler
#  itself was already one script (`bin/buildSite`, see its header); this is
#  the same rule one layer out: the TOOLCHAIN that feeds it is one file too.
#
#  The comments on each step are the ones publish-site carried, moved verbatim.
#  The caller checks the repository out first (a local action is read from it).
#
#  THE WASM IS CACHED TWO WAYS (DEV.md 4c C253 (a); measured 2026-11-09: the
#  emsdk install plus five binaries compiled from nothing took 1306 s of a
#  27-minute publish, on every push, register commits included):
#    1. THE WHOLE OUTPUT, keyed on the content hash of everything the WASM is
#       made from -- src/, make/, Makefile and data/standards/ (the curated
#       tree is EMBEDDED into every .wasm at link time, make/wasm.mk, so a
#       catalogue edit changes the engine and must not be skipped).  An exact
#       hit means the inputs are byte-identical to a build already made, so
#       emsdk is not even installed and `make wasm-gui` does not run: a
#       register-only, docs-only or gui-only commit costs a cache restore.
#    2. THE OBJECTS, through ccache (EM_COMPILER_WRAPPER), keyed on the same
#       hash with a prefix fallback: a change to src/ recompiles the changed
#       translation units and their dependents, not the five binaries from
#       scratch.  ccache is content-addressed, so a hit is correct by
#       construction -- unlike restoring build/wasm/, whose archived mtimes
#       are older than a fresh checkout's and would either rebuild everything
#       or, if `touch`ed to look fresh, hide a real source change.
#  An absent or evicted cache only costs the time it saved; it never changes
#  what is built.
name: build-site
description: Install the toolchain, build the WASM engines and the app, and assemble site/_dist with bin/buildSite.

runs:
  using: composite
  steps:
    #  ---- the toolchain: a C++ compiler for the native binaries the
    #       curation scripts run, Emscripten for the WASM, node for the app,
    #       and LaTeX for the guides the app links to.

    #  The key of the WASM: its inputs, by content.  See the header.
    - name: Restore the WASM if its inputs are unchanged
      id: wasm
      uses: actions/cache/restore@v4
      with:
        path: gui/public/wasm
        key: wasm-${{ hashFiles('src/**', 'make/**', 'Makefile', 'data/standards/**') }}

    - name: Emscripten
      if: steps.wasm.outputs.cache-hit != 'true'
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.6          # pinned: docs/gui-internals.md documents this
        actions-cache-folder: emsdk-cache   # the emsdk install itself, cached

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: gui/package-lock.json

    #  poppler-utils is NOT optional tooling.  bin/buildSite verifies the
    #  title page of every guide it is about to publish, and without
    #  pdftotext that check cannot run.  It used to WARN-and-continue, and
    #  on 2026-08-05 it did exactly that in this workflow -- the gate
    #  written to stop a stale guide reaching choupo.org was itself absent
    #  from the only place that publishes.  buildSite now REFUSES when it
    #  cannot verify, so this install is load-bearing: drop it and the
    #  publish fails loudly instead of shipping an unchecked artefact.
    - name: pdftotext (buildSite verifies the published guide versions)
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

    #  `lmodern` is load-bearing and NOT pulled by --no-install-recommends:
    #  docs/preamble.tex line 8 loads it, so without the deb every guide
    #  compile dies on its first package and buildSite's docs step never
    #  built anything here -- it fell to the warn branch and published the
    #  committed PDFs on every run.  Found 2026-08-30 when theoryGuide.tex
    #  had been uncompilable for three days (a \SI with no siunitx in the
    #  tree) and the served guide was stale behind its own source with the
    #  suite green.  buildSite now REFUSES on a failed docs build, so this
    #  list must actually compile the guides.
    - name: LaTeX (the guides the app's Help links serve)
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-recommended texlive-latex-extra texlive-pictures \
          texlive-fonts-recommended lmodern

    #  ---- the SAME chain proven locally, in the same order ---------------

    #  A restored WASM carries the mtimes it was archived with, older than the
    #  freshly checked-out sources, and bin/buildSite REFUSES a WASM older than
    #  src/ ("PRESENT IS NOT FRESH").  That guard is right for a hand build and
    #  is left exactly as it is; here the cache KEY has already proved the
    #  inputs identical, so the files are stamped as what they are -- current.
    - name: Use the restored WASM
      if: steps.wasm.outputs.cache-hit == 'true'
      shell: bash
      run: |
        ls -l gui/public/wasm | sed 's/^/[wasm cache] /'
        touch gui/public/wasm/*
        echo "::notice::WASM reused from cache: src/, make/, Makefile and data/standards/ are unchanged since it was built."

    - name: Restore the compiler cache for the WASM objects
      if: steps.wasm.outputs.cache-hit != 'true'
      id: wasmobj
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ccache
        key: ccache-wasm-${{ hashFiles('src/**', 'make/**', 'Makefile') }}
        restore-keys: |
          ccache-wasm-

    - name: Build the WASM the app runs
      if: steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      env:
        #  Emscripten's own hook: it puts ccache in front of the clang it runs
        #  for every compile (the link steps are not wrapped).
        EM_COMPILER_WRAPPER: ccache
        CCACHE_MAXSIZE: 1G
      run: |
        sudo apt-get install -y -qq ccache
        export CCACHE_DIR="$HOME/.cache/ccache"
        ccache -z
        make wasm-gui
        ccache -s | sed 's/^/[ccache] /'

    #  Saved HERE, before the smoke and the publish: a later step that fails
    #  or a run cancelled by the next push must not throw away the 20 minutes.
    - name: Save the WASM
      if: steps.wasm.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: gui/public/wasm
        key: wasm-${{ hashFiles('src/**', 'make/**', 'Makefile', 'data/standards/**') }}

    - name: Save the compiler cache for the WASM objects
      if: steps.wasm.outputs.cache-hit != 'true' && steps.wasmobj.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ccache
        key: ccache-wasm-${{ hashFiles('src/**', 'make/**', 'Makefile') }}

    - name: Install the app's dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
      working-directory: gui

    - name: Assemble the site
      shell: bash
      run: bin/buildSite
